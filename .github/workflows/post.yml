name: post

on:
  workflow_dispatch:
  schedule:
    # UTC 01:17 = KST 10:17 # 하지만 실제로는 큐가 길어서 훨씬 더 늦게 수행됨
    - cron: '17 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # uses
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
    # run
    - run: bun i
    - run: bun post
    env:
      BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
      BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
